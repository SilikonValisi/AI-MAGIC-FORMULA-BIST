name: Magic Formula run (manual)

# Manual-trigger only, no cron schedule — run from the Actions tab whenever
# wanted (e.g. once a year) rather than on a fixed cadence. Still runs on a
# GitHub-hosted runner rather than locally via launchd: isyatirim.com.tr was
# geo-blocked from the maintainer's actual location, but is reachable here.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Actions pipes step output (not a TTY), so Python fully
          # block-buffers stdout by default — without this, run_daily.py's
          # own print()s (including the ones forwarding the fetch script's
          # progress) would sit in a buffer instead of showing up live here.
          PYTHONUNBUFFERED: "1"
        run: python3 run_daily.py

      - name: Upload today's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
