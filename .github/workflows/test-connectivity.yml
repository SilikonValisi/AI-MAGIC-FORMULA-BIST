name: Test the bulk market-cap prefilter

# One-off diagnostic: run the real fetch_market_cap_lookup() + prefilter
# logic against the actual bist_tickers.txt universe and report how many
# tickers it matched, how many survive the prefilter, and spot-check a few
# known large/small caps. isyatirim is geo-blocked from the maintainer's
# machine, so this has to run where it's actually reachable. Delete once
# the prefilter is confirmed working.
on:
  push:
    branches: [main]
    paths: [".github/workflows/test-connectivity.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Run the prefilter against the real ticker universe
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from bist_magic_formula_midas import fetch_market_cap_lookup, load_tickers, PREFILTER_MARKET_CAP_FLOOR_MN_TL

          tickers = load_tickers('bist_tickers.txt')
          caps = fetch_market_cap_lookup()

          out = []
          out.append(f'bulk table matched {len(caps)} tickers total')
          matched = [t for t in tickers if t in caps]
          unmatched = [t for t in tickers if t not in caps]
          out.append(f'of {len(tickers)} tickers in bist_tickers.txt: {len(matched)} matched, {len(unmatched)} unmatched')
          out.append(f'unmatched sample: {unmatched[:20]}')

          survivors = [t for t in tickers if t not in caps or caps[t] >= PREFILTER_MARKET_CAP_FLOOR_MN_TL]
          out.append(f'prefilter (>= {PREFILTER_MARKET_CAP_FLOOR_MN_TL:,} mn TL or unmatched): {len(tickers)} -> {len(survivors)}')

          for spot in ['THYAO', 'ASELS', 'AKBNK', 'AVTUR', 'TUPRS']:
              out.append(f'  {spot}: cap={caps.get(spot)} in_bist_tickers={spot in tickers}')

          # a few of the smallest matched caps, to sanity-check they got dropped
          smallest = sorted(((t, c) for t, c in caps.items() if t in tickers), key=lambda x: x[1])[:10]
          out.append(f'10 smallest matched (in bist_tickers.txt): {smallest}')

          text = chr(10).join(out)
          print(text)
          with open('result.txt', 'w') as f:
              f.write(text + chr(10))
          "

      - name: Commit result
        run: |
          mkdir -p .github/test-results
          mv result.txt .github/test-results/result.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/test-results/result.txt
          git commit -m "Prefilter test result" || echo "nothing to commit"
          git push
