name: Test data source connectivity

# One-off diagnostic: can a GitHub-hosted runner actually reach isyatirim.com.tr
# and getmidas.com and pull real data, or are they geo/datacenter-blocked the
# same way the user's Thailand connection is? Only triggers on a change to
# this file itself, or manually. Delete this workflow once the question is
# answered either way.
on:
  push:
    branches: [main]
    paths: [".github/workflows/test-connectivity.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch one real ticker through the actual pipeline code
        run: |
          python3 -c "
          import sys
          from bist_magic_formula_midas import fetch_stock
          row = fetch_stock('THYAO')
          print('RESULT:', row)
          ok = bool(row and row.get('EarningsYield') is not None and row.get('RoC') is not None)
          with open('result.txt', 'w') as f:
              f.write('REACHABLE\n' if ok else 'BLOCKED_OR_FAILED\n')
              f.write(repr(row) + '\n')
          sys.exit(0 if ok else 0)  # don't fail the job either way, we just want the data point
          "

      - name: Commit result
        run: |
          mkdir -p .github/test-results
          mv result.txt .github/test-results/result.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/test-results/result.txt
          git commit -m "Connectivity test result" || echo "nothing to commit"
          git push
